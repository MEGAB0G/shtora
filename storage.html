<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shtora — Storage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shtora.css?v=20260201-01">
</head>
<body class="page">
    <div class="page-bg" aria-hidden="true">
        <div class="bg-blur bg-blur-1"></div>
        <div class="bg-blur bg-blur-2"></div>
        <div class="bg-blur bg-blur-3"></div>
        <div class="bg-grid"></div>
    </div>

    <header class="topbar">
        <a class="brand" href="index.html">
            <span class="brand-mark">S</span>
            <span class="brand-text">
                <span class="brand-title">Shtora</span>
                <span class="brand-subtitle">Storage</span>
            </span>
        </a>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="siteNav">
            <span></span><span></span><span></span>
        </button>

        <nav class="nav" id="siteNav">
            <a href="index.html">Витрина</a>
            <a href="#usage">Загрузка</a>
            <div class="nav-group">
                <button class="nav-group__trigger" type="button">Система</button>
                <div class="nav-group__menu">
                    <a href="storage.html">Хранилище</a>
                    <a href="index.html#status">Статус</a>
                </div>
            </div>
            <div class="nav-meta">
                <span class="label">Обновлено</span>
                <span id="usageUpdated">---</span>
            </div>
        </nav>
    </header>

    <main class="content">
        <section class="section" id="usage">
            <div class="section-header">
                <p class="eyebrow">Storage</p>
                <h2>Емкость пользователей</h2>
                <p>У каждого пользователя 150 ГБ на RAID и 150 ГБ на TRASH.</p>
            </div>

            <div class="usage-grid" id="userCards">
                <div class="status-card">
                    <div class="panel-title">Загрузка...</div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <span>© 2026 Shtora</span>
        <span>Storage overview</span>
    </footer>

    <script src="app.js?v=20260201-01"></script>
    <script>
        const toggle = document.querySelector('.nav-toggle');
        const nav = document.querySelector('.nav');
        if (toggle && nav) {
            toggle.addEventListener('click', () => {
                const expanded = toggle.getAttribute('aria-expanded') === 'true';
                toggle.setAttribute('aria-expanded', String(!expanded));
                nav.classList.toggle('is-open', !expanded);
            });
        }
    </script>
</body>
</html>
