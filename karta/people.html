<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>skarta — Эксперты</title>
    <meta name="description" content="Топ местных экспертов по выбранной стране." />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./skarta.css" />
  </head>
  <body data-page="people">
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="./index.html" aria-label="skarta">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__name">skarta</span>
        </a>
        <nav class="nav">
          <a class="nav__link nav__link--active" href="./people.html">Эксперты</a>
          <a class="nav__link" href="./create.html">Создать профиль</a>
        </nav>
      </div>
    </header>

    <main class="container container--wide">
      <section class="pageHeader">
        <div>
          <h1 class="pageHeader__title">Эксперты</h1>
          <p class="pageHeader__subtitle">Фильтруй по стране, теме, языку, рейтингу и цене.</p>
        </div>
        <div class="pageHeader__right">
          <a class="btn" href="./index.html">Назад</a>
          <a class="btn btn--primary" href="./create.html">Стать экспертом</a>
        </div>
      </section>

      <section class="layout">
        <aside class="sidebar card card--padded">
          <div class="h2">Фильтры</div>

          <form class="filters" id="filters">
            <div class="field">
              <label class="label" for="fCountry">Страна</label>
              <input id="fCountry" class="input" placeholder="Любая" list="countries" />
              <datalist id="countries"></datalist>
            </div>

            <div class="field">
              <label class="label" for="fQuery">Поиск</label>
              <input id="fQuery" class="input" placeholder="Имя, город, теги…" />
            </div>

            <div class="field">
              <label class="label" for="fCategory">Тема</label>
              <select id="fCategory" class="select">
                <option value="">Любая</option>
                <option value="Еда">Еда</option>
                <option value="Безопасность">Безопасность</option>
                <option value="Транспорт">Транспорт</option>
                <option value="Отели">Отели</option>
                <option value="Виза">Виза</option>
                <option value="Пляжи">Пляжи</option>
                <option value="Ночная жизнь">Ночная жизнь</option>
                <option value="Семья">Семья</option>
              </select>
            </div>

            <div class="field">
              <label class="label" for="fLanguage">Язык</label>
              <select id="fLanguage" class="select">
                <option value="">Любой</option>
                <option value="Русский">Русский</option>
                <option value="English">English</option>
                <option value="Español">Español</option>
                <option value="Deutsch">Deutsch</option>
                <option value="Français">Français</option>
                <option value="日本語">日本語</option>
                <option value="ไทย">ไทย</option>
              </select>
            </div>

            <div class="field">
              <label class="label" for="fMinRating">Рейтинг</label>
              <select id="fMinRating" class="select">
                <option value="0">Любой</option>
                <option value="4.8">4.8+</option>
                <option value="4.6">4.6+</option>
                <option value="4.4">4.4+</option>
                <option value="4.0">4.0+</option>
              </select>
            </div>

            <div class="field">
              <label class="label" for="fMaxPrice">Цена за вопрос (до)</label>
              <input id="fMaxPrice" class="input" type="number" min="1" step="1" placeholder="Напр. 25" />
            </div>

            <div class="field">
              <button class="btn btn--primary" type="submit">Применить</button>
              <button class="btn" id="resetFilters" type="button">Сбросить</button>
            </div>
          </form>
        </aside>

        <section class="content">
          <div class="content__bar">
            <div class="pill" id="resultPill">Загрузка…</div>
            <div class="muted" id="countryHint"></div>
          </div>
          <div class="people" id="peopleList" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__inner">
        <span class="muted">skarta • эксперты</span>
        <span class="muted">prototype</span>
      </div>
    </footer>

    <script type="module" src="./skarta.js"></script>
  </body>
</html>
