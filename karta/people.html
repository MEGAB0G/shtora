<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>skarta — Эксперты</title>
    <meta name="description" content="Топ местных экспертов по выбранной стране." />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./skarta.css" />
  </head>
  <body data-page="people">
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="./index.html" aria-label="skarta">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__name">skarta</span>
        </a>
        <div class="topbar__actions">
          <nav class="nav">
            <a class="nav__link" href="./feed.html" data-i18n="nav.feed">Лента</a>
            <a class="nav__link nav__link--active" href="./people.html" data-i18n="nav.experts">Эксперты</a>
            <a class="nav__link" href="./create.html" data-i18n="nav.createExpert">Создать профиль</a>
            <a class="nav__link" href="./chats.html" id="navChats" data-i18n="nav.chats">Чаты</a>
            <a class="nav__link" href="./register.html" id="navAuth" data-i18n="nav.login">Войти</a>
          </nav>
          <select class="langSelect" id="langSelect" aria-label="Language">
            <option value="ru">Русский</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
            <option value="tr">Türkçe</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="th">ไทย</option>
            <option value="ar">العربية</option>
            <option value="hi">हिन्दी</option>
            <option value="id">Bahasa Indonesia</option>
          </select>
        </div>
      </div>
    </header>

    <main class="container container--wide">
      <section class="pageHeader">
        <div>
          <h1 class="pageHeader__title" data-i18n="people.title">Эксперты</h1>
          <p class="pageHeader__subtitle" data-i18n="people.subtitle">Фильтруй по стране, теме, языку, рейтингу и цене.</p>
        </div>
        <div class="pageHeader__right">
          <a class="btn" href="./index.html" data-i18n="people.back">Назад</a>
          <a class="btn btn--primary" href="./create.html" data-i18n="people.becomeExpert">Стать экспертом</a>
        </div>
      </section>

      <section class="layout">
        <aside class="sidebar card card--padded">
          <div class="h2" data-i18n="people.filtersTitle">Фильтры</div>

          <form class="filters" id="filters">
            <div class="field">
              <label class="label" for="fCountry" data-i18n="people.country">Страна</label>
              <input
                id="fCountry"
                class="input"
                placeholder="Любая"
                list="countries"
                data-i18n-placeholder="people.any"
              />
              <datalist id="countries"></datalist>
            </div>

            <div class="field">
              <label class="label" for="fQuery" data-i18n="people.search">Поиск</label>
              <input
                id="fQuery"
                class="input"
                placeholder="Имя, город, теги…"
                data-i18n-placeholder="people.searchPlaceholder"
              />
            </div>

            <div class="field">
              <label class="label" for="fCategory" data-i18n="people.topic">Тема</label>
              <select id="fCategory" class="select">
                <option value="" data-i18n="people.any">Любая</option>
                <option value="Еда" data-i18n="topic.food">Еда</option>
                <option value="Безопасность" data-i18n="topic.safety">Безопасность</option>
                <option value="Транспорт" data-i18n="topic.transport">Транспорт</option>
                <option value="Отели" data-i18n="topic.hotels">Отели</option>
                <option value="Виза" data-i18n="topic.visa">Виза</option>
                <option value="Пляжи" data-i18n="topic.beaches">Пляжи</option>
                <option value="Ночная жизнь" data-i18n="topic.nightlife">Ночная жизнь</option>
                <option value="Семья" data-i18n="topic.family">Семья</option>
              </select>
            </div>

            <div class="field">
              <label class="label" for="fLanguage" data-i18n="people.language">Язык</label>
              <select id="fLanguage" class="select">
                <option value="" data-i18n="people.any">Любой</option>
                <option value="Русский">Русский</option>
                <option value="English">English</option>
                <option value="Español">Español</option>
                <option value="Deutsch">Deutsch</option>
                <option value="Français">Français</option>
                <option value="日本語">日本語</option>
                <option value="ไทย">ไทย</option>
              </select>
            </div>

            <div class="field">
              <label class="label" for="fMinRating" data-i18n="people.rating">Рейтинг</label>
              <select id="fMinRating" class="select">
                <option value="0" data-i18n="people.any">Любой</option>
                <option value="4.8">4.8+</option>
                <option value="4.6">4.6+</option>
                <option value="4.4">4.4+</option>
                <option value="4.0">4.0+</option>
              </select>
            </div>

            <div class="field">
              <label class="label" for="fMaxPrice" data-i18n="people.priceMax">Цена за вопрос (до)</label>
              <input
                id="fMaxPrice"
                class="input"
                type="number"
                min="1"
                step="1"
                placeholder="Напр. 25"
                data-i18n-placeholder="people.pricePlaceholder"
              />
            </div>

            <div class="field">
              <button class="btn btn--primary" type="submit" data-i18n="people.apply">Применить</button>
              <button class="btn" id="resetFilters" type="button" data-i18n="people.reset">Сбросить</button>
            </div>
          </form>
        </aside>

        <section class="content">
          <div class="content__bar">
            <div class="pill" id="resultPill" data-i18n="people.loading">Загрузка…</div>
            <div class="muted" id="countryHint"></div>
          </div>
          <div class="people" id="peopleList" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__inner">
        <span class="muted">skarta • эксперты</span>
        <span class="muted">prototype</span>
      </div>
    </footer>

    <script src="./skarta.js?v=20260214.2" defer></script>
  </body>
</html>
