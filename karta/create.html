<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>skarta — Создать профиль</title>
    <meta name="description" content="Создание профиля эксперта skarta." />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./skarta.css" />
  </head>
  <body data-page="create">
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="./index.html" aria-label="skarta">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__name">skarta</span>
        </a>
        <div class="topbar__actions">
          <nav class="nav">
            <a class="nav__link" href="./feed.html" data-i18n="nav.feed">Лента</a>
            <a class="nav__link" href="./people.html" data-i18n="nav.experts">Эксперты</a>
            <a class="nav__link nav__link--active" href="./create.html" data-i18n="nav.createExpert">Создать профиль</a>
            <a class="nav__link" href="./chats.html" id="navChats" data-i18n="nav.chats">Чаты</a>
            <a class="nav__link" href="./register.html" id="navAuth" data-i18n="nav.login">Войти</a>
          </nav>
          <select class="langSelect" id="langSelect" aria-label="Language">
            <option value="ru">Русский</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
            <option value="tr">Türkçe</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="th">ไทย</option>
            <option value="ar">العربية</option>
            <option value="hi">हिन्दी</option>
            <option value="id">Bahasa Indonesia</option>
          </select>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="pageHeader">
        <div>
          <h1 class="pageHeader__title" data-i18n="create.title">Создать профиль</h1>
          <p class="pageHeader__subtitle" data-i18n="create.subtitle">Таблица создания профиля (прототип).</p>
        </div>
        <div class="pageHeader__right">
          <a class="btn" href="./people.html" data-i18n="create.toExperts">К экспертам</a>
        </div>
      </section>

      <section class="card card--padded">
        <div class="pill" id="createMsg" aria-live="polite" data-i18n="create.loading">Загрузка…</div>
        <form id="createProfileForm">
          <table class="formTable" aria-label="Таблица создания профиля">
            <tbody>
              <tr>
                <th><label class="label" for="cName" data-i18n="create.name">Имя</label></th>
                <td><input id="cName" class="input" required placeholder="Напр.: Roman" data-i18n-placeholder="create.namePlaceholder" /></td>
              </tr>
              <tr>
                <th><label class="label" for="cCountry" data-i18n="create.country">Страна</label></th>
                <td>
                  <input
                    id="cCountry"
                    class="input"
                    required
                    list="countries"
                    placeholder="Выбери страну"
                    data-i18n-placeholder="create.countryPlaceholder"
                  />
                  <datalist id="countries"></datalist>
                </td>
              </tr>
              <tr>
                <th><label class="label" for="cCity" data-i18n="create.city">Город/район</label></th>
                <td><input id="cCity" class="input" required placeholder="Напр.: Paris / 11e" data-i18n-placeholder="create.cityPlaceholder" /></td>
              </tr>
              <tr>
                <th><label class="label" for="cLanguages" data-i18n="create.languages">Языки</label></th>
                <td><input id="cLanguages" class="input" required placeholder="Напр.: Русский, English" data-i18n-placeholder="create.languagesPlaceholder" /></td>
              </tr>
              <tr>
                <th><label class="label" for="cTopics" data-i18n="create.topics">Темы (через запятую)</label></th>
                <td><input id="cTopics" class="input" required placeholder="Еда, Безопасность, Транспорт" data-i18n-placeholder="create.topicsPlaceholder" /></td>
              </tr>
              <tr>
                <th><label class="label" for="cPrice" data-i18n="create.price">Цена за вопрос</label></th>
                <td>
                  <div class="row">
                    <input id="cPrice" class="input" type="number" min="1" step="1" required placeholder="Напр. 15" data-i18n-placeholder="create.pricePlaceholder" />
                    <span class="muted">USD</span>
                  </div>
                </td>
              </tr>
              <tr>
                <th><label class="label" for="cAbout" data-i18n="create.about">Описание</label></th>
                <td>
                  <textarea
                    id="cAbout"
                    class="textarea"
                    rows="5"
                    required
                    placeholder="Кто ты, чем поможешь туристам, почему тебе можно доверять…"
                    data-i18n-placeholder="create.aboutPlaceholder"
                  ></textarea>
                </td>
              </tr>
              <tr>
                <th><label class="label" for="cPhoto" data-i18n="create.photo">Фото профиля</label></th>
                <td>
                  <input id="cPhoto" class="input" type="file" accept="image/*" />
                  <div class="muted" data-i18n="create.photoHint">Можно пропустить — будет дефолтный аватар.</div>
                </td>
              </tr>
            </tbody>
          </table>

          <div class="actions">
            <button class="btn btn--primary" type="submit" data-i18n="create.submit">Создать профиль</button>
            <button class="btn" type="button" id="clearLocal" data-i18n="create.clearLocal">Очистить прототип-данные</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__inner">
        <span class="muted">skarta • create</span>
        <span class="muted">prototype</span>
      </div>
    </footer>

    <script src="./skarta.js" defer></script>
  </body>
</html>
