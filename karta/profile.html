<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>skarta — Профиль</title>
    <meta name="description" content="Профиль эксперта skarta." />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./skarta.css" />
  </head>
  <body data-page="profile">
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="./index.html" aria-label="skarta">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__name">skarta</span>
        </a>
        <div class="topbar__actions">
          <nav class="nav">
            <a class="nav__link" href="./feed.html" data-i18n="nav.feed">Лента</a>
            <a class="nav__link" href="./people.html" data-i18n="nav.experts">Эксперты</a>
            <a class="nav__link" href="./create.html" data-i18n="nav.createExpert">Создать профиль</a>
            <a class="nav__link" href="./chats.html" id="navChats" data-i18n="nav.chats">Чаты</a>
            <a class="nav__link" href="./register.html" id="navAuth" data-i18n="nav.login">Войти</a>
          </nav>
          <select class="langSelect" id="langSelect" aria-label="Language">
            <option value="ru">Русский</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
            <option value="tr">Türkçe</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="th">ไทย</option>
            <option value="ar">العربية</option>
            <option value="hi">हिन्दी</option>
            <option value="id">Bahasa Indonesia</option>
          </select>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="profileHero card card--padded" id="profileHero" aria-live="polite"></section>

      <section class="grid2 grid2--top">
        <div class="card card--padded">
          <div class="h2" data-i18n="profile.postsTitle">Посты</div>
          <div class="muted" data-i18n="profile.postsHint">Эксперт может выкладывать контент. В прототипе всё сохраняется на сервере.</div>
          <div class="posts" id="posts"></div>
        </div>

        <div class="stack">
          <div class="card card--padded">
            <div class="h2" data-i18n="profile.addPostTitle">Добавить пост</div>
            <form id="postForm" class="form">
              <div class="field">
                <label class="label" for="pTitle" data-i18n="profile.postTitleLabel">Заголовок</label>
                <input
                  id="pTitle"
                  class="input"
                  placeholder="Напр.: Как не переплатить в центре"
                  required
                  data-i18n-placeholder="profile.postTitlePlaceholder"
                />
              </div>
              <div class="field">
                <label class="label" for="pBody" data-i18n="profile.postBodyLabel">Текст</label>
                <textarea
                  id="pBody"
                  class="textarea"
                  rows="5"
                  placeholder="Коротко и по делу…"
                  required
                  data-i18n-placeholder="profile.postBodyPlaceholder"
                ></textarea>
              </div>
              <div class="field">
                <label class="label" for="pMedia" data-i18n="profile.mediaLabel">Медиа (фото/видео)</label>
                <input id="pMedia" class="input" type="file" accept="image/*,video/*" multiple />
                <div class="muted" data-i18n="profile.mediaHint">До 6 файлов. Видео — небольшие.</div>
                <div class="mediaPick" id="pMediaList"></div>
              </div>
              <div class="field">
                <button class="btn btn--primary" type="submit" data-i18n="profile.publish">Опубликовать</button>
              </div>
            </form>
          </div>

          <div class="card card--padded">
            <div class="h2" data-i18n="profile.reviewsTitle">Отзывы</div>
            <form id="reviewForm" class="form">
              <div class="field">
                <label class="label" for="rRating" data-i18n="profile.ratingLabel">Оценка</label>
                <select id="rRating" class="select" required>
                  <option value="5" data-i18n="profile.rate5">5 — отлично</option>
                  <option value="4" data-i18n="profile.rate4">4 — хорошо</option>
                  <option value="3" data-i18n="profile.rate3">3 — нормально</option>
                  <option value="2" data-i18n="profile.rate2">2 — плохо</option>
                  <option value="1" data-i18n="profile.rate1">1 — ужасно</option>
                </select>
              </div>
              <div class="field">
                <label class="label" for="rText" data-i18n="profile.commentLabel">Комментарий</label>
                <textarea
                  id="rText"
                  class="textarea"
                  rows="4"
                  placeholder="Что было полезно?"
                  required
                  data-i18n-placeholder="profile.commentPlaceholder"
                ></textarea>
              </div>
              <div class="field">
                <button class="btn" type="submit" data-i18n="profile.leaveReview">Оставить отзыв</button>
              </div>
            </form>
            <div class="reviews" id="reviews"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__inner">
        <span class="muted">skarta • профиль</span>
        <span class="muted">prototype</span>
      </div>
    </footer>

    <script src="./skarta.js?v=20260214.5" defer></script>
  </body>
</html>
