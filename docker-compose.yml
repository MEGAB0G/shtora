services:
  api:
    image: node:20-alpine
    working_dir: /app/phone-server
    command: ["sh", "-c", "npm install --omit=dev --no-package-lock && node server.js"]
    environment:
      - SKARTA_DATA_DIR=/data/skarta
    volumes:
      - ./:/app
      - node_modules:/app/phone-server/node_modules
      - /srv:/host-srv:ro
      - /exchange:/host-exchange:ro
      - skarta_data:/data
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

volumes:
  node_modules:
  skarta_data:
